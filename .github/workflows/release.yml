name: Release

# Publishes a GitHub release (tag, notes from CHANGES.md and installable ZIP)
# for each new theme version that reaches main.
on:
  push:
    branches: [main]
    paths: [theme/epure/version.php]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Read the version
        id: version
        run: |
          release=$(sed -n "s/^\$plugin->release *= *'\([^']*\)'.*/\1/p" theme/epure/version.php)
          maturity=$(sed -n 's/^\$plugin->maturity *= *\([A-Z_]*\).*/\1/p' theme/epure/version.php)
          echo "release=$release" >> "$GITHUB_OUTPUT"
          if [ "$maturity" != "MATURITY_STABLE" ]; then echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT"; fi
          if gh release view "v$release" > /dev/null 2>&1; then echo "exists=1" >> "$GITHUB_OUTPUT"; fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build the ZIP and the notes
        if: ${{ !steps.version.outputs.exists }}
        env:
          RELEASE: ${{ steps.version.outputs.release }}
        run: |
          (cd theme && zip -qr "../theme_epure-$RELEASE.zip" epure -x 'epure/node_modules/*')
          # The file to install first: GitHub adds « Source code » archives of the whole repository to every
          # release, which Moodle does not recognise as a theme.
          {
            printf '**To install: download `theme_epure-%s.zip`** in the Assets below (not « Source code »), then Site administration › Plugins › Install plugins.\n\n' "$RELEASE"
            printf '**Pour installer : téléchargez `theme_epure-%s.zip`** dans les Assets ci-dessous (pas « Source code »), puis Administration du site › Plugins › Installer des plugins.\n\n' "$RELEASE"
            printf '## Changes\n'
            awk -v v="$RELEASE" '
              /^## / { if (found) exit; if (index($0, "## " v) == 1) { found = 1; next } }
              found { print }
            ' CHANGES.md
          } > notes.md
          cat notes.md

      - name: Publish the release
        if: ${{ !steps.version.outputs.exists }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ steps.version.outputs.release }}
        run: |
          gh release create "v$RELEASE" "theme_epure-$RELEASE.zip" --target "$GITHUB_SHA" \
            --title "Épure $RELEASE" --notes-file notes.md ${{ steps.version.outputs.prerelease }}
