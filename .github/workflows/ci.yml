name: Moodle plugin CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        # Moodle 5.3 requires PostgreSQL 17; the earlier versions run on 16.
        image: postgres:${{ matrix.include-moodle.pg || '16' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3
      # MariaDB 11.4 meets the requirements of Moodle 4.5 to 5.3 (5.3 requires 11.4).
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_CHARACTER_SET_SERVER: utf8mb4
          MARIADB_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval 10s --health-timeout 5s --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        plugin: [theme/epure]
        include-moodle:
          - { branch: MOODLE_405_STABLE, php: '8.1' }
          - { branch: MOODLE_405_STABLE, php: '8.3' }
          - { branch: MOODLE_500_STABLE, php: '8.3' }
          - { branch: MOODLE_501_STABLE, php: '8.3' }
          - { branch: MOODLE_502_STABLE, php: '8.3' }
          - { branch: MOODLE_503_STABLE, php: '8.4', pg: '17' }
          - { branch: MOODLE_405_STABLE, php: '8.3', db: mariadb }
          - { branch: MOODLE_503_STABLE, php: '8.4', db: mariadb }
          # IOMAD, whose tables and classes were renamed in 5.1 (theme_epure\iomad knows both).
          - { branch: IOMAD_405_STABLE, php: '8.3', repo: 'https://github.com/iomad/iomad.git' }
          - { branch: IOMAD_501_STABLE, php: '8.3', repo: 'https://github.com/iomad/iomad.git' }
          - { branch: IOMAD_502_STABLE, php: '8.3', repo: 'https://github.com/iomad/iomad.git' }

    name: ${{ matrix.plugin }} — ${{ matrix.include-moodle.branch }} — PHP ${{ matrix.include-moodle.php }} — ${{ matrix.include-moodle.db || 'pgsql' }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.include-moodle.php }}
          extensions: pgsql, mysqli, zip, gd, xmlrpc, soap
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      # IOMAD: its themes declare third-party files they do not ship (amd/src/bootstrap/, amd/src/index.js), which
      # stops moodle-plugin-ci (grunt ignorefiles); they are added, empty, to a local clone, installed from there.
      - name: Prepare IOMAD
        if: ${{ matrix.include-moodle.repo }}
        run: |
          git clone -q --depth 1 --branch "${{ matrix.include-moodle.branch }}" "${{ matrix.include-moodle.repo }}" iomad-src
          python3 - <<'PY'
          import glob, os, re
          for xml in glob.glob('iomad-src/**/thirdpartylibs.xml', recursive=True):
              base = os.path.dirname(xml)
              for location in re.findall(r'<location>\s*([^<]+?)\s*</location>', open(xml, encoding='utf-8').read()):
                  path = os.path.join(base, location)
                  if '*' in location or os.path.exists(path):
                      continue
                  print('Missing in IOMAD, added empty:', path)
                  if location.endswith('/'):
                      os.makedirs(path, exist_ok=True)
                      open(os.path.join(path, '.gitkeep'), 'w').close()
                  else:
                      os.makedirs(os.path.dirname(path), exist_ok=True)
                      open(path, 'w').close()
          PY
          git -C iomad-src add -A
          git -C iomad-src -c user.name=CI -c user.email=ci@example.com commit -q -m "CI: directory of theme_iomad" || true
          echo "IOMAD_LOCAL=file://$GITHUB_WORKSPACE/iomad-src" >> "$GITHUB_ENV"

      # IOMAD: Behat is not initialised (its auth_iomadsaml2 context is not compatible with Behat on 4.5, and the
      # Behat tests run on Moodle); PHPUnit is initialised on its own.
      - name: Install Moodle and the plugin
        run: |
          moodle-plugin-ci install --plugin ./repo/${{ matrix.plugin }} --db-host=127.0.0.1 ${{ matrix.include-moodle.repo && '--no-init' || '' }}
          if [ -n "${{ matrix.include-moodle.repo }}" ]; then
            # From 5.1, the code of Moodle is under public/.
            init=moodle/admin/tool/phpunit/cli/init.php
            [ -f "$init" ] || init=moodle/public/admin/tool/phpunit/cli/init.php
            php "$init" > /dev/null
          fi
        env:
          DB: ${{ matrix.include-moodle.db || 'pgsql' }}
          MOODLE_BRANCH: ${{ matrix.include-moodle.branch }}
          MOODLE_REPO: ${{ env.IOMAD_LOCAL || matrix.include-moodle.repo || 'https://github.com/moodle/moodle.git' }}

      - name: PHP lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: Moodle code checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      # Not on IOMAD: its themes copy Boost's Behat features under the same names, which gherkinlint refuses; the
      # code of Épure is linted on the Moodle jobs.
      - name: Grunt
        if: ${{ !cancelled() && !matrix.include-moodle.repo }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Behat accessibility tests (axe)
        if: ${{ !cancelled() && !matrix.include-moodle.db && ((matrix.include-moodle.branch == 'MOODLE_405_STABLE' && matrix.include-moodle.php == '8.3') || matrix.include-moodle.branch == 'MOODLE_503_STABLE') }}
        run: moodle-plugin-ci behat --profile chrome --tags @theme_epure
